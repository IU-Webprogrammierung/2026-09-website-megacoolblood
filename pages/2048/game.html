<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <meta name="theme-color" content="#000" media="not all" data-scheme="oled" />
    <title>2048 spielen | LycheeLab</title>
    <script src="../../js/theme.js"></script>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/2048.css" />
    <link rel="icon" type="image/png" href="../../assets/images/LycheeLab.png" />
    <link rel="apple-touch-icon" href="../../assets/images/apple-touch-icon.png" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <script src="../../js/components.js" defer></script>
    <script src="../../js/pwa.js" defer></script>
    <script src="../../js/2048/game.js" defer></script>
  </head>

  <body>
    <lycheelab-include src="../../components/header.html"></lycheelab-include>

    <main id="main-content" tabindex="-1">
      <section class="game-panel game-2048" aria-labelledby="game-heading">
        <header class="game-header">
          <div class="game-header-intro">
            <h1 id="game-heading">2048</h1>
            <div class="game-controls" role="group" aria-label="Spielsteuerung">
              <button type="button" id="new-game">Neustart (R)</button>
              <button type="button" id="undo-move" disabled>Zurück (Backspace / Strg+Z)</button>
            </div>
            <p id="game-status" role="status" aria-live="polite" aria-atomic="true">Bereit für ein neues Spiel.</p>
          </div>
          <dl>
            <div>
              <dt>Punktestand</dt>
              <dd id="game-score">0</dd>
            </div>
            <div>
              <dt>Bestwert</dt>
              <dd id="best-score">0</dd>
            </div>
          </dl>
        </header>

        <div
          id="game-board"
          class="board-2048"
          role="grid"
          tabindex="0"
          aria-label="2048-Spielfeld"
          aria-describedby="game-status"
        ></div>
      </section>
    </main>
    <lycheelab-include src="../../components/footer.html"></lycheelab-include>
  </body>
</html>
