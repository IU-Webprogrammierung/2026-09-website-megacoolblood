<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 spielen | LycheeLab</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/2048.css">
  <link rel="icon" type="image/png" href="../../assets/images/LycheeLab-small.png">
</head>
<body>
  <header>
    <a class="site-logo" href="../../index.html"><img src="../../assets/images/LycheeLab-small.png" alt="LycheeLab"></a>
    <nav aria-label="Hauptnavigation">
      <ul>
        <li><a href="../../index.html">Übersicht</a></li>
        <li><a href="game.html" aria-current="page">Spielen</a></li>
        <li><a href="instructions.html">Spielanleitung</a></li>
        <li><a href="statistics.html">Statistiken</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="game-panel game-2048" aria-labelledby="game-heading">
      <header class="game-header">
        <div class="game-header-intro">
          <h1 id="game-heading">2048</h1>
          <div class="game-controls" role="group" aria-label="Spielsteuerung">
            <button type="button" id="new-game">Neustart</button>
            <button type="button" id="undo-move" disabled>Zurück</button>
          </div>
          <p id="game-status" role="status" aria-live="polite" aria-atomic="true">Bereit für ein neues Spiel.</p>
        </div>
        <dl>
          <div>
            <dt>Punktestand</dt>
            <dd id="game-score">0</dd>
          </div>
          <div>
            <dt>Bestwert</dt>
            <dd id="best-score">0</dd>
          </div>
        </dl>
      </header>

      <div id="game-board" class="board-2048" role="grid" tabindex="0" aria-label="2048-Spielfeld" aria-describedby="game-status">
      </div>
    </section>
  </main>

  <footer>
    <a href="../impressum.html">Impressum</a>
    <a href="../datenschutz.html">Datenschutz</a>
  </footer>
  <script src="../../js/2048/game.js"></script>
</body>
</html>
