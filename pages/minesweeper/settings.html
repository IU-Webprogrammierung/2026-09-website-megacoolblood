<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper-Einstellungen | LycheeLab</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/minesweeper.css">
  <link rel="icon" type="image/png" href="../../assets/images/LycheeLab-small.png">
  <script src="../../js/components.js" defer></script>
</head>
<body>
  <component path="../../components/header.html"></component>

  <main id="main-content" tabindex="-1">
    <h1>Minesweeper-Einstellungen</h1>
    <form id="settings-form">
      <fieldset>
        <legend>Schwierigkeitsgrad</legend>
        <label for="difficulty">Auswahl</label>
        <select id="difficulty" name="difficulty">
          <option value="beginner">Anfänger</option>
          <option value="intermediate">Fortgeschritten</option>
          <option value="expert">Experte</option>
        </select>
      </fieldset>
      <button type="submit">Einstellungen speichern</button>
      <p id="settings-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <component path="../../components/footer.html"></component>
  <script src="../../js/minesweeper/settings.js"></script>
</body>
</html>
