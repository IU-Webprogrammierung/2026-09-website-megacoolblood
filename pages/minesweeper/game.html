<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper spielen | LycheeLab</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header>
    <a href="../../index.html">LycheeLab</a>
    <nav aria-label="Hauptnavigation">
      <ul>
        <li><a href="../../index.html">Übersicht</a></li>
        <li><a href="game.html" aria-current="page">Spielen</a></li>
        <li><a href="settings.html">Einstellungen</a></li>
        <li><a href="highscores.html">Highscores</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Minesweeper</h1>
    <p id="game-status" role="status">Bereit für ein neues Spiel.</p>
    <section aria-labelledby="game-info-heading">
      <h2 id="game-info-heading">Spielinformationen</h2>
      <dl>
        <div>
          <dt>Verbleibende Minen</dt>
          <dd id="mine-count">0</dd>
        </div>
        <div>
          <dt>Aktuelle Siegesserie</dt>
          <dd id="winning-streak">0</dd>
        </div>
      </dl>
      <button type="button" id="new-game">Neues Spiel</button>
    </section>
    <section aria-labelledby="board-heading">
      <h2 id="board-heading">Spielfeld</h2>
      <p id="board-description">Das Spielfeld wird in einer späteren Entwicklungsphase mit interaktiven Feldern gefüllt.</p>
      <div id="game-board" class="game-board" role="grid" aria-labelledby="board-heading" aria-describedby="board-description"></div>
    </section>
  </main>

  <footer>
    <a href="../impressum.html">Impressum</a>
    <a href="../datenschutz.html">Datenschutz</a>
  </footer>
  <script src="../../js/game.js"></script>
</body>
</html>
