<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper spielen | LycheeLab</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header>
    <a href="../../index.html">LycheeLab</a>
    <nav aria-label="Hauptnavigation">
      <ul>
        <li><a href="../../index.html">Übersicht</a></li>
        <li><a href="game.html" aria-current="page">Spielen</a></li>
        <li><a href="instructions.html">Spielanleitung</a></li>
        <li><a href="settings.html">Einstellungen</a></li>
        <li><a href="highscores.html">Highscores</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="game-panel" aria-labelledby="game-info-heading">
      <header class="game-header">
        <div class="game-header-intro">
          <h1>Minesweeper</h1>
          <p id="game-status" role="status">Bereit für ein neues Spiel.</p>
        </div>
        <h2 id="game-info-heading" class="visually-hidden">Spielinformationen</h2>
        <dl>
          <div>
            <dt>Verbleibende Minen</dt>
            <dd id="mine-count">0</dd>
          </div>
          <div>
            <dt>Aktuelle Siegesserie</dt>
            <dd id="winning-streak">0</dd>
          </div>
          <div>
            <dt>Höchster Highscore</dt>
            <dd id="highest-score">0</dd>
          </div>
        </dl>
        <button type="button" id="new-game">Neustart</button>
        <label for="player-name">Name für den Highscore</label>
        <input id="player-name" name="player-name" type="text" maxlength="24" value="Spieler">
      </header>
      <div id="game-board" class="game-board" role="grid" aria-labelledby="board-heading" aria-describedby="board-description"></div>
      <footer class="game-footer">
        <div class="game-modes" role="group" aria-label="Eingabemodus">
          <span>Modus:</span>
          <button type="button" class="mode-button is-active" data-mode="reveal" aria-pressed="true">Aufdecken (A)</button>
          <button type="button" class="mode-button" data-mode="flag" aria-pressed="false">Flagge (F)</button>
          <button type="button" class="mode-button" data-mode="mark" aria-pressed="false">Markieren (M)</button>
        </div>
      </footer>
    </section>
  </main>

  <footer>
    <a href="../impressum.html">Impressum</a>
    <a href="../datenschutz.html">Datenschutz</a>
  </footer>
  <script src="../../js/game.js"></script>
</body>
</html>
