    <p id="highscore-status" role="status">Lokal gespeicherte Siegesserien.</p>

      <table>
        <caption>Highscore-Liste nach Siegesserie</caption>
        <thead>
          <tr>

            <th scope="col">Schwierigkeit</th>
            <th scope="col">Datum</th>
          </tr>
        </thead>
        <tbody id="highscore-list"></tbody>
      </table>
    </div>
